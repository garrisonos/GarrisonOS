name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Check"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path-to-signatures: 'signatures/version2/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/docs/legal/CLA.md'
          branch: 'main'
          allowlist: 'bot*|*bot,garrison-bot,coderabbitai[bot],coderabbitai'
          custom-notsigned-prcomment: |
            Thank you for your contribution to GarrisonOS! 🏰

            Before we can review and merge your pull request, you must sign our [Contributor License Agreement (CLA)](https://github.com/${{ github.repository }}/blob/main/docs/legal/CLA.md).

            You can agree to the CLA by simply posting a comment on this pull request with the exact text:
            > **I have read the CLA Document and I hereby sign the CLA**
          custom-allsigned-prcomment: 'All contributors have signed the GarrisonOS CLA. Thank you!'

